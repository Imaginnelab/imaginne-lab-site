name: Prepare production deployment

# A merge into main builds a production deployment on Vercel but does not put it live.
# Going live is a manual step: Vercel → imaginne-lab-site → Deployments → the new one →
# Promote. The same screen rolls back to an earlier deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_EbYm1ZwnAvsF36WCPTreXTgB
      VERCEL_PROJECT_ID: prj_Ui7dxXaSbZmjBIbuRpAnObde7Nov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Only a PR approved by the other person, with its checks passed, gets deployed.
      - name: Require an approved pull request
        run: node .github/scripts/require-approved-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVERS: GabrielFarinela,guifarinela

      # Without Git metadata the deployment belongs to the token's owner, so
      # Vercel does not block it because of who wrote the commit.
      - name: Remove Git metadata
        run: rm -rf .git

      # --skip-domain: built as production, but www.imaginnelab.com keeps serving the current
      # deployment until someone promotes this one on Vercel.
      - name: Build the deployment (not live yet)
        run: |
          url=$(npx --yes vercel@65.8.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --meta commit="$GITHUB_SHA")
          echo "Ready to promote: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
